name: RuStore screenshots (demo emulator)

on:
  workflow_dispatch:
  # One-time generation after adding this workflow; the run can also be
  # repeated manually from the Actions tab at any time.
  push:
    paths:
      - '.github/workflows/rustore-screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug app (release never contains demo fixture)
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Capture store screenshots with synthetic schedules
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/capture-rustore-screens.sh
      - name: Upload actual app screenshots for RuStore
        uses: actions/upload-artifact@v4
        with:
          name: moi-rezhim-rustore-screenshots
          path: rustore-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

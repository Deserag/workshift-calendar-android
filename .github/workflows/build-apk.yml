name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools are missing from $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test shift and alarm rules
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          VERIFY="$SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$VERIFY" verify --verbose --print-certs "$APK"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -Fq "android.permission.INTERNET" permissions.txt; then
            echo "::error::Unexpected network permission found in APK"
            exit 1
          fi
          OUTPUT="app/build/outputs/apk/debug/workshift-calendar-v0.6.0-debug.apk"
          cp "$APK" "$OUTPUT"
          echo "### Проверенный файл APK" >> "$GITHUB_STEP_SUMMARY"
          echo "APK собран, его подпись проверена; эти проверки **не заменяют антивирусное сканирование**." >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      # GitHub Actions v7 can publish one file without wrapping it in an
      # additional ZIP. Keep the real APK filename for easier scanning.
      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/debug/workshift-calendar-v0.6.0-debug.apk
          if-no-files-found: error
